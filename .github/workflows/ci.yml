name: Glowithsya CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: glowithsya_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: glowithsya_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Laravel tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: glowithsya_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test


  staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy script
        run: |
          chmod +x deploy.sh
          bash -n deploy.sh

      - name: Staging ready
        run: echo "Staging deployment validation successful."


  production:
    name: Production
    runs-on: ubuntu-latest
    needs: staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: glowithsya
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql

      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh

      - name: Prepare SSH deployment user
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: Prepare deployment directory
        run: |
          mkdir -p "$HOME/glowithsya"
          cp -R . "$HOME/glowithsya"

          cd "$HOME/glowithsya"

          cp .env.example .env

          php artisan key:generate

      - name: Run deploy script through SSH
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: glowithsya
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            "$(whoami)@127.0.0.1" \
            "cd \$HOME/glowithsya && \
             export DB_CONNECTION=mysql && \
             export DB_HOST=127.0.0.1 && \
             export DB_PORT=3306 && \
             export DB_DATABASE=glowithsya && \
             export DB_USERNAME=root && \
             export DB_PASSWORD=root && \
             bash deploy.sh"